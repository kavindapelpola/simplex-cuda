[package]
name = "simplex-cuda"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
cust = "0.3.2"
ndarray = "0.17.1"
tracing = "0.1.44"

[dev-dependencies]
criterion = "0.8.1"
tracing-subscriber = "0.3.22"

# Aggressive optimization for benchmarks
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "model"
harness = false

[[bench]]
name = "simplex"
harness = false
